predict:
  kind: choice
  prompt: |
    $x = \{1, 2, 1\}$ (3 samples) convolves with $h = \{1, 1, 1\}$ (3 samples).
    **Commit:** how many samples can y have, and what is the middle one?
  choices:
    - "3 samples; middle = 2"
    - "5 samples; middle = 4"
    - "6 samples; middle = 3"
    - "5 samples; middle = 3"
  answer: 1
  resolution: |
    Length N+M−1 = 5. Middle: y[2] = x[0]h[2] + x[1]h[1] + x[2]h[0] = 1+2+1 = 4. Audit: Σy = Σx·Σh
    = 4·3 = 12 and indeed {1,3,4,3,1} sums to 12. The length rule and the sum-check catch nearly
    every table slip — use both, every time.

quiz:
  - id: q-table
    kind: numeric
    tags: [checkpoint]
    prompt: "For x = {1, 2, 1} ∗ h = {1, 1, 1} (both starting at n = 0), compute y[1]."
    answer: 3
    tolerance: 0
    explanation: "y[1] = x[0]h[1] + x[1]h[0] = 1 + 2 = 3. Anti-diagonal k+m = 1 of the product grid."
  - id: q-length
    kind: numeric
    tags: [checkpoint]
    prompt: "x starts at n = 2 (4 samples); h starts at n = −1 (3 samples). y starts at n = ? "
    answer: 1
    tolerance: 0
    explanation: "Start indices ADD: 2 + (−1) = 1. (And length = 4+3−1 = 6.) Index bookkeeping is where table marks leak."
  - id: q-ma
    kind: mcq
    tags: [checkpoint]
    prompt: "The 3-point moving average h = {⅓,⅓,⅓} acting on a signal:"
    choices:
      - "sharpens edges"
      - "smooths noise and blurs edges — a low-pass by construction"
      - "delays without change"
      - "amplifies"
    answer: 1
    explanation: "Averaging kills fast wiggles (noise) and rounds fast transitions (edges) — the smoothing/sharpness trade in three coefficients."
  - id: q-stability
    kind: numeric
    tags: [checkpoint]
    prompt: "h[n] = (0.8)ⁿu[n]. Compute Σ|h[n]| (the BIBO test value)."
    answer: 5
    tolerance: 0.01
    explanation: "Geometric: 1/(1−0.8) = 5 < ∞ ⇒ stable. Equivalently: pole at 0.8, inside the unit circle. Two languages, one criterion."
  - id: q-step
    kind: mcq
    tags: [checkpoint]
    prompt: "The DT step response s[n] relates to h[n] by:"
    choices:
      - "s = h shifted"
      - "s[n] = running sum of h up to n; h[n] = s[n] − s[n−1]"
      - "s = h squared"
      - "they are unrelated"
    answer: 1
    explanation: "u = running sum of δ, and sums/differences commute with LTI systems — the DT twin of s = ∫h, h = ds/dt."
  - id: q-transfer
    kind: mcq
    prompt: "To cancel the FIR echo channel h = δ[n] + ½δ[n−3], the inverse system is:"
    choices:
      - "another FIR of length 4"
      - "IIR: G(z) = 1/(1 + ½z⁻³) — inverting FIR generally requires feedback"
      - "impossible"
      - "a moving average"
    answer: 1
    explanation: "The inverse of a polynomial in z⁻¹ is rational ⇒ recursive. Stable here since the zeros of H sit inside the unit circle. A favorite interview two-liner."
