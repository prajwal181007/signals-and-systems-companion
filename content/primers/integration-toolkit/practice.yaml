predict:
  kind: choice
  prompt: |
    You need $\int_0^\infty t\,e^{-3t}\,dt$ under exam pressure. **Commit to the answer:**
  choices:
    - "1/3"
    - "1/9"
    - "1/6"
    - "3"
  answer: 1
  resolution: |
    Pattern 2: $\int_0^\infty t^n e^{-at}dt = n!/a^{n+1}$ with n=1, a=3 gives $1/9$. If you said 1/3
    you used pattern 1 (no polynomial); the extra power of a comes from the by-parts pass. This
    formula alone will save you ten minutes across the semester's exams.

quiz:
  - id: q-p1
    kind: numeric
    tags: [checkpoint]
    prompt: "Evaluate $\\int_0^\\infty e^{-4t}\\,dt$."
    answer: 0.25
    tolerance: 0.001
    explanation: "Pattern 1: 1/a = 1/4, valid because a = 4 > 0."
  - id: q-p3
    kind: expression
    tags: [checkpoint]
    prompt: "In terms of a and b, what is $\\int_0^\\infty e^{-at}\\sin(bt)\\,dt$? (Answer with variables a, b.)"
    answer: "b/(a^2+b^2)"
    vars: [a, b]
    explanation: "The Im part of 1/(a−jb) = (a+jb)/(a²+b²). The cosine version takes the Re part: a/(a²+b²)."
  - id: q-cond
    kind: mcq
    tags: [checkpoint]
    prompt: "For which s does $\\int_0^\\infty e^{-2t}e^{-st}dt$ converge?"
    choices:
      - "all s"
      - "Re(s) > −2"
      - "Re(s) > 2"
      - "s > 0 only"
    answer: 1
    explanation: "Combined exponent −(s+2)t needs Re(s+2) > 0. This condition IS the ROC of e^{−2t}u(t) — the primer's biggest foreshadow."
  - id: q-parts
    kind: mcq
    tags: [checkpoint]
    prompt: "By parts on $\\int t^2 e^{-st}dt$: which assignment is right, and why?"
    choices:
      - "u = e^{-st}, dv = t²dt — integrate the polynomial"
      - "u = t², dv = e^{-st}dt — differentiate the polynomial so it eventually dies"
      - "Either works equally"
      - "By parts doesn't apply"
    answer: 1
    explanation: "Each pass must simplify: polynomials die under differentiation (t² → 2t → 2 → done); exponentials never get worse under integration."
  - id: q-moving
    kind: expression
    tags: [checkpoint]
    prompt: "Evaluate $\\int_0^{t} e^{-(t-\\tau)}\\,d\\tau$ as a function of t (t > 0)."
    answer: "1 - e^(-t)"
    vars: [t]
    explanation: "Freeze t, pull e^{−t} out, integrate e^{τ}: e^{−t}(e^{t}−1). This IS the RC step response — and the convolution-regime rehearsal."
