predict:
  kind: choice
  prompt: |
    A perfectly LTI audio system is fed a pure 440 Hz tone. **Commit:** what frequencies can the
    steady-state output contain?
  choices:
    - "440 Hz and its harmonics (880, 1320, …) — systems add texture"
    - "Only 440 Hz — possibly rescaled and phase-shifted"
    - "A band around 440 Hz"
    - "Depends on the system's internals"
  answer: 1
  resolution: |
    Sinusoids are (pairs of) eigenfunctions: the system can only scale and delay them. Harmonics in
    the output would prove the box is NOT linear — that is literally how distortion is measured.
    "Systems add texture" is the everyday intuition this concept replaces with something sharper.

quiz:
  - id: q-eigen
    kind: mcq
    tags: [checkpoint]
    prompt: "The response of an LTI system to $e^{j2t}$ is $0.5e^{j(2t - \\pi/3)}$. Its response to $4e^{j2t}$ is:"
    choices:
      - "$2e^{j(2t-\\pi/3)}$"
      - "$0.5e^{j(8t-\\pi/3)}$"
      - "$4e^{j2t}$"
      - "cannot be determined"
    answer: 0
    explanation: "Homogeneity: scale the input by 4, output scales by 4. The eigenvalue H(j2) = 0.5e^{−jπ/3} is fixed; frequency never changes."
  - id: q-step-shortcut
    kind: expression
    tags: [checkpoint]
    prompt: "An LTI system has step response $s(t) = (1 - e^{-t})u(t)$. Write its response to $x(t) = 2u(t) - 2u(t-1)$ at time t (for t > 1). Answer as a function of t."
    answer: "2(1 - e^(-t)) - 2(1 - e^(-(t-1)))"
    vars: [t]
    explanation: "Superposition: y = 2s(t) − 2s(t−1). For t > 1 both steps are active; the expression simplifies to 2e^{−(t−1)} − 2e^{−t}, and any equivalent form is accepted."
  - id: q-deriv
    kind: mcq
    tags: [checkpoint]
    prompt: "For an LTI system, how are step response s(t) and impulse response h(t) related?"
    choices:
      - "$s = dh/dt$"
      - "$h = ds/dt$ and $s(t) = \\int_{-\\infty}^{t} h(\\tau)d\\tau$"
      - "They are equal"
      - "Unrelated without more information"
    answer: 1
    explanation: "δ = du/dt and differentiation commutes with LTI systems. Measure whichever is easier; differentiate/integrate to get the other."
  - id: q-privileges
    kind: mcq
    tags: [checkpoint]
    prompt: "A student uses superposition on $y = x^2$ to predict the response to a sum of inputs. What went wrong?"
    choices:
      - "Nothing — superposition always applies"
      - "The system is nonlinear: $(x_1+x_2)^2 \\ne x_1^2 + x_2^2$; the privilege was never earned"
      - "Superposition needs three inputs"
      - "The inputs must be sinusoids"
    answer: 1
    explanation: "The cross term 2x₁x₂ is the violation. Verify LTI before invoking any of its consequences — a recurring exam trap."
  - id: q-transfer
    kind: mcq
    prompt: "An amplifier outputs faint components at 880 Hz and 1320 Hz when driven at 440 Hz. What did you just measure?"
    choices:
      - "Its impulse response"
      - "Its nonlinearity (harmonic distortion) — an LTI box cannot create those"
      - "Aliasing"
      - "Its time-variation"
    answer: 1
    explanation: "New frequencies are the fingerprint of nonlinearity. (Aliasing needs sampling; time-variation shifts/spreads differently.)"
