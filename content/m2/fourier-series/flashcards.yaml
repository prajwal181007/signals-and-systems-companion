cards:
  - id: c-pair
    front: "Exponential FS: analysis and synthesis formulas."
    back: "$c_k = \\frac{1}{T_0}\\int_{T_0} x e^{-jk\\omega_0 t}dt$;  $x = \\sum_k c_k e^{jk\\omega_0 t}$. Don't drop the 1/T₀."
  - id: c-real
    front: "For real x: relation between c₋ₖ and cₖ, and trig conversions."
    back: "$c_{-k} = c_k^*$;  a₀ = c₀ (average), aₖ = 2Re cₖ, bₖ = −2Im cₖ."
  - id: c-symm
    front: "Symmetry → surviving coefficient families."
    back: "Even ⇒ cosines only. Odd ⇒ sines only (no DC). Half-wave x(t−T₀/2) = −x(t) ⇒ odd harmonics only."
  - id: c-square
    front: "FS of the ±1 square wave."
    back: "$\\frac{4}{\\pi}\\left[\\sin\\omega_0 t + \\frac{1}{3}\\sin 3\\omega_0 t + \\frac{1}{5}\\sin 5\\omega_0 t + \\cdots\\right]$ — odd sines, 1/k."
  - id: c-decay
    front: "The smoothness ⇔ decay law."
    back: "Jump ⇒ |cₖ| ~ 1/k; continuous with corners ⇒ 1/k²; each derivative of smoothness buys one factor of 1/k (integration by parts)."
  - id: c-power
    front: "Parseval, power form (periodic signals)."
    back: "$P = \\frac{1}{T_0}\\int_{T_0}|x|^2 dt = \\sum_k |c_k|^2$ — count both ±k stems."
