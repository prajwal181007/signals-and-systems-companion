predict:
  kind: choice
  prompt: |
    You must invert F(s) = 1/((s+1)(s+2)) — a product of two simple factors.
    **Commit before you compute:** what is f(t) for t > 0?
  choices:
    - "e^(-t) · e^(-2t) = e^(-3t) — multiply the two time functions"
    - "e^(-t) + e^(-2t) — one exponential per pole, equal amounts"
    - "e^(-t) − e^(-2t) — one exponential per pole, weighted by residues"
    - "t·e^(-t) — the two factors combine into a repeated-pole form"
  answer: 2
  resolution: |
    Cover-up gives residues +1 at s = −1 and −1 at s = −2, so f(t) = (e^(-t) − e^(-2t))u(t).
    The first choice is the classic trap: multiplication in s corresponds to CONVOLUTION in t,
    not multiplication — which is exactly why partial fractions exists: it converts the product
    into a sum, and sums invert term-by-term. The equal-weights choice forgets that residues
    are computed, not assumed.

quiz:
  - id: q-coverup
    kind: numeric
    tags: [checkpoint]
    prompt: "F(s) = (2s+5)/((s+1)(s+3)). Using cover-up, find the residue at the pole s = −1."
    answer: 1.5
    tolerance: 0.01
    explanation: "Cover (s+1), evaluate the rest at s = −1: (2(−1)+5)/(−1+3) = 3/2. The term is 1.5/(s+1), contributing 1.5·e^(-t)u(t)."
  - id: q-firstmove
    kind: mcq
    tags: [checkpoint]
    prompt: "F(s) = (s^2+3s+1)/(s^2+3s+2). What is the correct FIRST move?"
    choices:
      - "Cover-up on the factored denominator (s+1)(s+2)"
      - "Long division, because deg N = deg D — F is not strictly proper"
      - "Complete the square in the denominator"
      - "Differentiate F(s) to reduce the numerator degree"
    answer: 1
    explanation: "Partial fractions requires strictly proper F. Division gives F = 1 − 1/((s+1)(s+2)), so f(t) = δ(t) − (e^(-t) − e^(-2t))u(t). Skipping the division corrupts every residue — this is the most expensive silent error in the module."
  - id: q-repeated
    kind: mcq
    tags: [checkpoint]
    prompt: "What is the inverse Laplace transform of 1/(s+2)^2 (causal)?"
    choices:
      - "e^(-2t) u(t)"
      - "t · e^(-2t) u(t)"
      - "e^(-4t) u(t)"
      - "(e^(-2t))^2 u(t) — the transform squared means the signal squared"
    answer: 1
    explanation: "A double pole gives t·e^(-2t)u(t) — the limit of two colliding poles leaving their difference quotient behind. Squaring in s is convolution in t, and e^(-2t)u ∗ e^(-2t)u = t·e^(-2t)u(t): same answer, longer route."
  - id: q-complex
    kind: mcq
    tags: [checkpoint]
    prompt: "F(s) = (s+1)/((s+1)^2 + 9). Which f(t) is correct (causal)?"
    choices:
      - "e^(-t) cos(3t) u(t)"
      - "e^(-t) cos(9t) u(t)"
      - "e^(-t) sin(3t) u(t)"
      - "cos(3t) u(t)"
    answer: 0
    explanation: "Completed-square form with a = 1, ω² = 9 so ω = 3 — the table's cos row exactly, since the numerator is (s+1). The ω in the waveform is the square ROOT of the constant, and the e^(-t) envelope comes from the shift — dropping either loses the mark."
  - id: q-expr
    kind: expression
    tags: [checkpoint]
    prompt: "Write f(t) for F(s) = 2/(s+1), taking the causal (right-sided) inverse."
    answer: "2 e^(-t) u(t)"
    vars: [t]
    explanation: "One pole at s = −1, residue 2: a single mode 2e^(-t), switched on by u(t) because we chose the right-sided ROC."
  - id: q-roc-left
    kind: mcq
    prompt: "F(s) = 1/(s+1) with stated ROC Re{s} < −1. What is f(t)?"
    choices:
      - "e^(-t) u(t) — the table says so"
      - "−e^(-t) u(−t) — a left-sided signal"
      - "e^(t) u(t)"
      - "The ROC is impossible for this F(s)"
    answer: 1
    explanation: "Same algebra, different signal: an ROC to the LEFT of the pole selects the anticausal inverse −e^(-t)u(−t). The table's u(t) forms assume the right-sided ROC — when a problem states the ROC, the ROC wins."
  - id: q-conv-bridge
    kind: mcq
    prompt: "Y(s) = X(s)·H(s). In the time domain, y(t) equals…"
    choices:
      - "x(t) · h(t)"
      - "(x ∗ h)(t) — the convolution"
      - "x(t) + h(t)"
      - "x(t) · h(t) only when both are causal"
    answer: 1
    explanation: "Products in s are convolutions in t — the property that makes the Laplace transform worth the trip. It is also why partial fractions (turn the product into a sum) is the inversion tool, and pointwise multiplication of time functions never is."

